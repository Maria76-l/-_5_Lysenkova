# Блок 1: Метаданные проекта
# Здесь указывается имя пакета, версия, описание и автор.
# Эти данные используются Poetry для идентификации проекта.

[tool.poetry]
name = "python-template"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]

# Блок 2: Основные зависимости (dependencies)
# Зависимости, необходимые для работы приложения в среде выполнения.
# Указан диапазон версий Python (>=3.10 и <3.11).
# Остальные библиотеки зафиксированы с помощью семантического версионирования (^).

[tool.poetry.dependencies]
python = ">=3.10.0,<3.11"
numpy = "^1.22.2"
replit = "^3.2.4"
Flask = "^2.2.0"
urllib3 = "^1.26.12"

# Блок 3: Зависимости для разработки (dev-dependencies)
# Инструменты, используемые только во время разработки и тестирования.
# debugpy – отладчик для Python.
# replit-python-lsp-server – сервер языкового протокола (LSP) с дополнительными
# возможностями форматирования (yapf), рефакторинга (rope) и проверки ошибок (pyflakes).

[tool.poetry.dev-dependencies]
debugpy = "^1.6.2"
replit-python-lsp-server = {extras = ["yapf", "rope", "pyflakes"], version = "^1.5.9"}

# Блок 4: Система сборки (build-system)
# Определяет, какой инструмент используется для сборки проекта.
# poetry-core – стандартный бэкенд Poetry для создания пакетов.

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"